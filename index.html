const DB={version:'2026.09.13-nso-27',checked:'13.09.2026',region:'Новосибирская область',changes:[{date:'13.09.2026',title:'Автоматический контроль дедлайнов',text:'Центр решения и кабинет показывают оставшееся время до практической крайней даты подачи ежегодной семейной выплаты — 30 сентября 2026 года.'},{date:'11.09.2026',title:'Больничные для самозанятых',text:'СФР НСО сообщает о новой мере для участников добровольного страхования.',source:'https://sfr.gov.ru/branches/novosibirsk/news/~2026/09/11/284651'},{date:'08.09.2026',title:'Ускорено распоряжение маткапиталом',text:'СФР НСО сообщил об ускорении основной части решений по заявлениям о распоряжении маткапиталом.',source:'https://sfr.gov.ru/branches/novosibirsk/news/~2026/09/08/284545'}],sources:[{name:'СФР — единое пособие',url:'https://sfr.gov.ru/grazhdanam/semyam_s_detmi/edinoe_posobie/'},{name:'СФР — Новосибирская область',url:'https://sfr.gov.ru/branches/novosibirsk/'},{name:'Минтруд НСО — семьи с детьми',url:'https://mtsr.nso.ru/page/2134'},{name:'ЦСПН НСО — выплаты и пособия',url:'https://cspn.nso.ru/page/1637'},{name:'Минтруд НСО — новости и изменения',url:'https://nszn.nso.ru/ER/News'},{name:'Минтруд НСО — социальный контракт',url:'https://nszn.nso.ru/EE/News/NewsCard/670'}],rules:{pm:18560,childPm:18003,workingPm:20230,mrot:27093,minAnnual:216744,annualFamilyPm:26067,avgSalary2025:88683.70,avgSalary2024:76770.30,birth:34140.54,childCareNonworking:12803.57,unemploymentMin:2236,unemploymentMax:19063,socialContractWork:20230,socialContractBusiness:350000}};
const DB_OVERRIDE=JSON.parse(localStorage.getItem('mne_db_override')||'null'); if(DB_OVERRIDE){Object.assign(DB,DB_OVERRIDE); DB.rules=Object.assign({},DB.rules,DB_OVERRIDE.rules||{});} let REMOTE_DB=null;
async function syncRemoteDB(){try{const r=await fetch('./db.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;const x=await r.json();if(x.version && x.checked && x.rules && (!DB.version || x.version>DB.version)){REMOTE_DB=x; Object.assign(DB,x); DB.rules=Object.assign({},x.rules); save(); render();}}catch(e){}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
syncRemoteDB();
let S=JSON.parse(localStorage.getItem('mne_state')||'null')||{screen:'home',text:'',chatMessages:[],chatStep:0,members:2,adults:1,children:1,childAges:[2],income:50000,annualFamilyIncome:600000,adultIncome:50000,alimony:0,alimonyMode:'none',singleParent:false,property:'не проверено',apartments:0,apartmentArea:0,houses:0,houseArea:0,garages:0,landHa:0,urbanLand:true,cars:0,carPowerMax:0,carAgeMin:99,motos:0,boats:0,propertySupport:false,propertyArrested:false,propertyBad:false,propertySharedThird:false,pregnant:false,reason:'нет объективной причины',objectiveMonths:0,married:true,workingAdults:1,applicationMonth:new Date().toISOString().slice(0,7),annualAdultIncome:50000*12,adultAnnualIncomes:[600000],taxPaid2025:78000,annualEmploymentIncome2025:600000,taxableIncome2025:600000,annualFamilyIncome2025:600000,newbornCount:0,pregnancyRegisteredBy12:null,russianCitizenship:null,permanentResidence:null,taxDebt:false,alimonyDebt:false,adultReasons:['нет объективной причины'],adultObjectiveMonths:[0],renewal2026:false,refusedOnlyIncome:false,updated:DB.checked,history:[],currentApplication:null};
S.refusalHistory=Array.isArray(S.refusalHistory)?S.refusalHistory:[]; S.lastRefusal=S.lastRefusal||null; S.planDone=(S.planDone&&typeof S.planDone==='object')?S.planDone:{};
S.history=Array.isArray(S.history)?S.history:[]; S.currentApplication=S.currentApplication||null; S.historyPrompted=!!S.historyPrompted;
function save(){localStorage.setItem('mne_state',JSON.stringify(S))}
function addHistoryRecord(type,title,status,amount,note,submittedAt,renewalDate){S.history=S.history||[];S.history.unshift({id:Date.now()+Math.random(),type:title&&type?type:'manual',title,status,amount:amount||'',note:note||'',date:submittedAt||new Date().toISOString().slice(0,10),renewalDate:renewalDate||'',updatedAt:new Date().toLocaleDateString('ru-RU')});save();render()}
function removeHistoryRecord(id){S.history=(S.history||[]).filter(x=>String(x.id)!==String(id));if(S.currentApplication&&String(S.currentApplication.historyId)===String(id))S.currentApplication=null;save();render()}
function updateHistoryStatus(id,status){let x=(S.history||[]).find(x=>String(x.id)===String(id));if(!x)return;x.status=status;x.updatedAt=new Date().toLocaleDateString('ru-RU');if(status==='Одобрено'&&!x.renewalDate&&x.title.includes('Единое пособие')){let d=new Date();d.setFullYear(d.getFullYear()+1);x.renewalDate=d.toISOString().slice(0,10);x.note=(x.note?x.note+' · ':'')+'Дата продления рассчитана ориентировочно на 12 месяцев; проверьте по решению СФР.'}save();render()}
function editHistory(id){let x=(S.history||[]).find(x=>String(x.id)===String(id));if(!x)return;const title=prompt('Название меры',x.title||'');if(title===null)return;const amount=prompt('Сумма',x.amount||'');if(amount===null)return;const renewal=prompt('Дата следующего продления (ГГГГ-ММ-ДД)',x.renewalDate||'');if(renewal===null)return;const note=prompt('Комментарий',x.note||'');if(note===null)return;x.title=title||x.title;x.amount=amount;x.renewalDate=renewal;x.note=note;x.updatedAt=new Date().toLocaleDateString('ru-RU');save();render()}
function addCurrentApplicationHistory(status='Черновик'){const title=S.children?'Единое пособие':'Мера социальной поддержки';const existing=(S.history||[]).find(x=>x.type==='application'&&x.title===title&&x.status==='Черновик');if(existing){existing.updatedAt=new Date().toLocaleDateString('ru-RU');S.currentApplication={historyId:existing.id,title:existing.title,status:existing.status};save();return existing.id}const id=Date.now()+Math.random();S.history=S.history||[];S.history.unshift({id,type:'application',title,status,amount:'',note:'Черновик подготовлен в приложении',date:new Date().toISOString().slice(0,10),renewalDate:'',updatedAt:new Date().toLocaleDateString('ru-RU')});S.currentApplication={historyId:id,title,status};save();return id}
function markCurrentApplication(status){let id=S.currentApplication?.historyId;let x=id&&(S.history||[]).find(x=>String(x.id)===String(id));if(!x){id=addCurrentApplicationHistory(status);x=(S.history||[]).find(x=>String(x.id)===String(id));}else{x.status=status;x.updatedAt=new Date().toLocaleDateString('ru-RU');if(status==='Одобрено'&&!x.renewalDate&&x.title.includes('Единое пособие')){let d=new Date();d.setFullYear(d.getFullYear()+1);x.renewalDate=d.toISOString().slice(0,10);x.note=(x.note?x.note+' · ':'')+'Дата продления ориентировочная — проверьте решение СФР.'}}S.currentApplication={historyId:x.id,title:x.title,status};save();render();toast(status==='Подано'?'Заявление отмечено как поданное':'Статус обновлён') }
function saveRefusalToHistory(){const title=S.children?'Единое пособие — отказ':'Мера поддержки — отказ';const existing=(S.history||[]).find(x=>x.type==='refusal'&&x.title===title&&x.note===S.lastRefusal?.summary);if(existing)return;S.history=S.history||[];S.history.unshift({id:Date.now()+Math.random(),type:'refusal',title,status:'Отказ',amount:'',note:S.lastRefusal?.summary||'Причина отказа разобрана',date:new Date().toISOString().slice(0,10),renewalDate:'',updatedAt:new Date().toLocaleDateString('ru-RU')});save()}
function historyActions(){const now=new Date(),out=[];(S.history||[]).forEach(x=>{if(x.status==='Рассматривается')out.push({kind:'review',text:`Проверьте статус заявления «${x.title}».`});if(x.status==='Подано')out.push({kind:'next',text:`Заявление «${x.title}» подано. Сохраните номер заявления и контролируйте срок рассмотрения.`});if(x.status==='Одобрено'&&x.renewalDate){const d=new Date(x.renewalDate+'T00:00:00');if(!isNaN(d)){const days=Math.ceil((d-now)/86400000);out.push({kind:days<0?'urgent':days<=30?'soon':'next',text:days<0?`Срок продления «${x.title}» уже наступил — проверьте заявление.`:`Следующее продление «${x.title}» — ${d.toLocaleDateString('ru-RU')} (через ${days} дн.).`})}}if(x.status==='Отказ')out.push({kind:'refusal',text:`По «${x.title}» сохранён отказ. Разберите причину и проверьте законные варианты.`});if(x.status==='Черновик')out.push({kind:'next',text:`Черновик «${x.title}» готов. Проверьте данные и отметьте заявление как поданное после фактической отправки.`});});return out.slice(0,8)}
function exportHistory(){const blob=new Blob([JSON.stringify(S.history||[],null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mne-polozheno-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function smartRoute(){const items=evaluateAllPrograms(), first=items.find(x=>x.status==='pass')||items.find(x=>x.status==='check')||items[0];if(first){plan(first);const exists=(S.history||[]).some(h=>h.type==='draft'&&h.title===first.title);if(!exists){S.history=S.history||[];S.history.unshift({id:Date.now()+Math.random(),type:'route',title:first.title,status:'Черновик',amount:first.amount||'',note:'Автоматически созданный маршрут: проверить условия → документы → подача → контроль результата.',date:new Date().toISOString().slice(0,10),renewalDate:'',updatedAt:new Date().toLocaleDateString('ru-RU')});save()}toast('Персональный маршрут построен')}}
function deadlineStatus(){const now=new Date(),year=now.getMonth()>8||(now.getMonth()===8&&now.getDate()>=30)?now.getFullYear()+1:now.getFullYear(),end=new Date(year+'-09-30T23:59:59');const days=Math.ceil((end-now)/86400000);if(now>end)return {days:0,label:'Срок подачи истёк',tone:'fail'};if(days<=7)return {days,label:`Осталось ${days} дн.`,tone:'fail'};if(days<=30)return {days,label:`Осталось ${days} дн.`,tone:'need'};return {days,label:`До 30.09.${year} — ${days} дн.`,tone:'ok'}}
function submissionPack(){const items=evaluateAllPrograms(),x=items.find(v=>v.id===S.plan)||items.find(v=>v.status==='pass')||items.find(v=>v.status==='check')||items[0];if(!x)return {title:'Мера социальной поддержки',docs:[],steps:[]};let docs=[...(x.docs||[])];if(x.id==='annual-family')docs.push('сведения о доходах и НДФЛ за 2025 год','проверка отсутствия алиментной задолженности');if(x.id==='unified-child')docs.push('сведения об имуществе и транспорте — сверить с реестрами');return {title:x.title,docs:[...new Set(docs)],steps:['Проверить данные профиля и расчётный период','Сверить документы и межведомственные сведения','Подать через Госуслуги, СФР или МФЦ','Сохранить номер заявления и уведомление','После решения зафиксировать результат в истории']}}
function navigatorView(){const c=calc(),items=evaluateAllPrograms(),a=ageSummary(),missing=missingData(c),pass=items.filter(x=>x.status==='pass'),checks=items.filter(x=>x.status==='check'),fails=items.filter(x=>x.status==='fail'),rank=[...pass,...checks,...fails].slice(0,5);const completeness=Math.max(0,Math.min(100,100-Math.min(80,missing.length*14)-(c.property.status==='unknown'?12:0)-(S.russianCitizenship===null?6:0)-(S.permanentResidence===null?6:0)));const top=pass[0]||checks[0]||items[0];if(top)S.plan=top.id;save();return `<section class="panel"><div class="row"><h2>🧭 Центр решения</h2><span class="status ${completeness>=80?'ok':completeness>=55?'need':'fail'}">Готовность профиля: ${completeness}%</span></div><div class="card good"><h3>Что делать прямо сейчас</h3><p class="muted">Я собрал профиль, проверил доступные меры и расставил приоритеты. Сначала закройте недостающие данные, затем идите по первой зелёной мере.</p>${top?`<div class="legal"><b>${statusIcon(top.status)} ${esc(top.title)}</b><br>${esc(top.reason||'Есть основание проверить эту меру.')}</div>`:''}<div class="actions"><button class="primary" onclick="nav('actions')">Открыть маршрут →</button><button class="secondary" onclick="nav('application')">📝 Подготовить заявление</button></div></div><div class="grid"><div class="metric"><span class="muted">Подтверждено</span><br><b>${pass.length}</b> мер</div><div class="metric"><span class="muted">Нужна проверка</span><br><b>${checks.length}</b> мер</div><div class="metric"><span class="muted">Не проходит</span><br><b>${fails.length}</b> мер</div><div class="metric"><span class="muted">Среднедушевой доход</span><br><b>${money(c.per)}</b><div class="small">Порог единого пособия: ${money(DB.rules.pm)}</div></div></div>${missing.length?`<div class="card warn"><h3>⚠️ Что мешает точному ответу</h3>${missing.slice(0,6).map(v=>`<div class="legal">${esc(v)}</div>`).join('')}<div class="actions"><button class="primary" onclick="nav('profile')">Заполнить данные →< function parseText(t){syncDerived();const x=(t||'').toLowerCase().replace(/ё/g,'е');const words={один:1,одна:1,два:2,две:2,двое:2,три:3,трое:3,четыре:4,четверо:4,пять:5,пятеро:5,шесть:6,семь:7,восемь:8,девять:9,десять:10};let m=x.match(/(?:^|\s)(\d+)\s*(?:дет|детей|реб|ребен|ребят)/);if(m)S.children=+m[1];let cw=x.match(/(?:^|\s)(один|одна|два|две|двое|три|трое|четыре|четверо|пять|пятеро|шесть|семь|восемь|девять|десять)\s+(?:дет|реб)/);if(cw)S.children=words[cw[1]];if(/многодет|трое\s+дет|три\s+реб/.test(x))S.children=Math.max(3,S.children);let ad=x.match(/(?:^|\s)(\d+)\s*(?:взросл|родител|совершеннолет)/);if(ad)S.adults=Math.max(1,+ad[1]);if(/муж\b|жена\b|мы\s+вдвоем/.test(x))S.adults=Math.max(2,S.adults||2);let ages=[...x.matchAll(/(\d{1,2})\s*(?:лет|года|год|мес|месяц)/g)].map(a=>+a[1]).filter(a=>a<=17).slice(0,8);if(ages.length)S.childAges=ages;const pats=[/(?:доход(?:\s+семьи)?|зарплат\w*|получа\w*|зарабатыва\w*)[^\d]{0,25}(\d[\d\s]{2,})(?:\s*(руб|р|₽|тысяч|тыс|к))?/i,/(\d[\d\s]{2,})\s*(руб(?:лей)?|тысяч(?:и)?|тыс\.?|к)\b/i];let inc=null;for(const re of pats){inc=x.match(re);if(inc)break;}if(inc){let v=parseInt(inc[1].replace(/\s/g,''),10);if(/тысяч|тыс|\bк\b/.test(inc[0]))v*=1000;if(v>=1000){S.income=v;S.annualFamilyIncome=v*12;}}if(/беремен/.test(x)){S.pregnant=true;let w=x.match(/(\d{1,2})\s*(?:нед|недель)/);if(w)S.pregnancyWeeks=+w[1];}if(/единственн(?:ый|ая)\s+родител|отец\s+(?:не\s+указан|прочерк)|отца\s+нет/.test(x))S.singleParent=true;if(/самозанят/.test(x))S.selfEmployed=true;if(/инвалид/.test(x))S.disability=true;if(/пенсионер|пенсия/.test(x))S.pension=true;if(/студент|учусь\s+очно/.test(x))S.student=true;if(/не\s+работ|без\s+работ|не\s+трудоустро|уволен|нет\s+работы/.test(x))S.workingAdults=0;else if(/оба\s+работ|муж\s+работ|жена\s+работ|я\s+работ|работаю|работает|трудоустро/.test(x))S.workingAdults=Math.max(1,S.workingAdults||1);if(/оба\s+работ/.test(x))S.workingAdults=Math.max(2,S.adults);if(/алим[её]н/.test(x)){if(/алим[её]н\w*\s*(?:нет|не\s+получ|не\s+пла)/.test(x)){S.alimony=0;S.alimonyMode='none';}else{let a=x.match(/алим[её]н\w*[^\d]{0,20}(\d[\d\s]{2,})/);if(a){S.alimony=parseInt(a[1].replace(/\s/g,''),10);S.alimonyMode='actual';}}}S.members=Math.max(1,S.adults+S.children);S.adultIncome=S.workingAdults?Math.max(S.income,0):0;save()}

 else{x.reason='Не указан факт рождения ребёнка в актуальном периоде. Наличие детей само по себе не означает право на эту единовременную выплату.';x.missing.push('дата/факт рождения ребёнка');}

 else x={...x,status:'check',reason:'Мера может быть доступна по отдельным направлениям (работа, бизнес и др.), но требуется региональная оценка нуждаемости.'};items.push(x);

function propertyCheck(){
 const members=Math.max(1,+S.members||1),kids=Math.max(0,+S.children||0);
 const a=Math.max(0,+S.apartments||0), aa=Math.max(0,+S.apartmentArea||0), h=Math.max(0,+S.houses||0), ha=Math.max(0,+S.houseArea||0), g=Math.max(0,+S.garages||0), land=Math.max(0,+S.landHa||0), cars=Math.max(0,+S.cars||0), motos=Math.max(0,+S.motos||0), boats=Math.max(0,+S.boats||0), power=Math.max(0,+S.carPowerMax||0), age=Math.max(0,+S.carAgeMin||0);
 const exceptions=[];
 if(S.propertySupport) exceptions.push('Имущество, предоставленное как целевая мера государственной социальной поддержки, может не учитываться.');
 if(S.propertyArrested) exceptions.push('Имущество под арестом или с запретом регистрационных действий может не учитываться.');
 if(S.propertyBad) exceptions.push('Непригодное для проживания жильё может не учитываться.');
 if(S.propertySharedThird) exceptions.push('Доля/доли общей собственности в пределах установленного исключения могут не учитываться.');
 const reasons=[];
 const details=[];
 // Official SFR logic: one apartment or one house is allowed regardless of area; multiple same-type objects are limited by area per family member. A mixed apartment+house combination is not rejected solely by summing their areas.
 if(a>1 && aa/members>24) reasons.push(`Квартиры: ${a}, общая площадь ${aa} м² = ${(aa/members).toFixed(1)} м² на человека, выше ориентира 24 м².`);
 if(h>1 && ha/members>40) reasons.push(`Жилые дома: ${h}, общая площадь ${ha} м² = ${(ha/members).toFixed(1)} м² на человека, выше ориентира 40 м².`);
 if(a===1) details.push('Одна квартира сама по себе не создаёт отказ по площади.');
 if(h===1) details.push('Один жилой дом сам по себе не создаёт отказ по площади.');
 if(a>1) details.push(`Квартиры: ${a}; ${aa} м² всего; ${ (aa/members).toFixed(1)} м²/чел.`);
 if(h>1) details.push(`Дома: ${h}; ${ha} м² всего; ${ (ha/members).toFixed(1)} м²/чел.`);
 const multi=kids>=3;
 const disability=!!S.disability;
 const garageLimit=(multi||disability)?2:1;
 if(g>garageLimit) reasons.push(`Гаражей/машино-мест: ${g}; для введённого профиля ориентир — не более ${garageLimit}.`);
 const landLimit=S.urbanLand===false?1:0.25;
 if(land>landLimit) reasons.push(`Земельные участки: ${land} га; для выбранного типа местности ориентир — не более ${landLimit} га.`);
 const carLimit=(multi||disability)?2:1;
 if(cars>carLimit) reasons.push(`Автомобилей: ${cars}; для введённого профиля ориентир — не более ${carLimit}.`);
 // A car under 5 years with >250 hp is a special risk; for families with 4+ children there is a statutory exception.
 if(cars>0 && age<5 && power>250 && kids<4) reasons.push(`Есть автомобиль младше 5 лет мощностью ${power} л.с.; для семьи с менее чем 4 детьми это требует отдельной проверки и может стать основанием для отказа.`);
 if(motos>carLimit) reasons.push(`Мотоциклов: ${motos}; ориентир — не более ${carLimit}.`);
 if(boats>0) details.push(`Маломерные суда: ${boats}; для точной проверки нужны тип и возраст судна, поскольку применяются отдельные исключения.`);
 if(exceptions.length) details.push(...exceptions);
 const hasAny=[a,h,g,land,cars,motos,boats].some(Boolean);
 if(reasons.length) return {status:'fail',title:'Есть конкретный имущественный риск',reasons,details,exceptions};
 if(!hasAny) return {status:'unknown',title:'Имущество не заполнено',reasons:['Без сведений о недвижимости, земле и транспорте нельзя подтвердить имущественный критерий.'],details,exceptions};
 if(exceptions.length) return {status:'unknown',title:'Есть заявленное исключение по имуществу — нужна проверка',reasons:details,details,exceptions};
 return {status:'pass',title:'По введённым объектам явного превышения не найдено',reasons:details.length?details:['По введённым параметрам явного превышения не найдено. СФР всё равно сверяет реестровые сведения автоматически.'],details,exceptions};
}
function calc(){
syncDerived();
const annualFamilyIncome=Math.max(0,+S.annualFamilyIncome||(+S.income||0)*12);
const kids=Math.max(0,+S.children||0);
let monthlyAlimony=Math.max(0,+S.alimony||0);
if(S.alimonyMode==='imputed'&&!S.singleParent&&kids>0&&(!S.applicationMonth||S.applicationMonth>='2026-03')){const share=kids===1?.25:kids===2?1/3:.5;monthlyAlimony=DB.rules.avgSalary2025*share}
const annualAlimony=monthlyAlimony*12;
const familySize=Math.max(1,S.members);
const per=(annualFamilyIncome+annualAlimony)/12/familySize;
const adults=Math.max(1,+S.adults||1);
const incomes=(Array.isArray(S.adultAnnualIncomes)?S.adultAnnualIncomes:[]).map(x=>Math.max(0,+x||0));
while(incomes.length<adults)incomes.push(Math.max(0,+S.annualAdultIncome||0));
const adultMin=incomes.slice(0,adults).map((v,i)=>{
 const reason=S.adultReasons?.[i]||((i===0&&S.reason)||'нет объективной причины');
 const months=Math.max(0,Math.min(12,+S.adultObjectiveMonths?.[i] ?? (i===0?S.objectiveMonths:0) ?? 0));
 const hasReason=reason!=='нет объективной причины';
 const required=hasReason?DB.rules.minAnnual/12*(12-months):DB.rules.minAnnual;
 return {index:i+1,income:v,reason,months,required,passes:v>=required||months>=10};
});
const minPass=adultMin.every(x=>x.passes);
const objective=adultMin.some(x=>x.reason!=='нет объективной причины');
const objectiveMonths=Math.max(...adultMin.map(x=>x.months),0);
const effectiveMin=Math.min(...adultMin.map(x=>x.required));
const prop=propertyCheck();
const propertyPass=prop.status==='pass';
const uni=kids>0&&per<=DB.rules.pm&&minPass&&propertyPass;
const tenPercent=kids>=3&&S.renewal2026&&S.refusedOnlyIncome&&per>DB.rules.pm&&per<=DB.rules.pm*1.10;
const annualFamilyIncome2025=Math.max(0,+S.annualFamilyIncome2025||0);
const annualFamilyPer2025=annualFamilyIncome2025/12/familySize;
const estimatedAnnualFamilyRefund=Math.max(0,(+S.taxPaid2025||0)-(Math.max(0,+S.annualEmploymentIncome2025||0)*0.06));
const requiredWorkingParents=Math.max(1,Math.min(adults, S.singleParent?1:adults));
const annualFamily=kids>=2&&S.workingAdults>=requiredWorkingParents&&annualFamilyPer2025<=DB.rules.annualFamilyPm&&annualFamilyIncome2025>0&&S.taxPaid2025>0&&!S.alimonyDebt&&propertyPass;
let rate=0;
if(uni){for(const r of [50,75,100]){const benefitPerCapita=(DB.rules.childPm*(r/100)*kids)/familySize;if(per+benefitPerCapita<=DB.rules.pm){rate=r;break}}if(!rate)rate=100}
return {per,adultMin,adultAnnual:adultMin[0]?.income||0,minPass,objective,objectiveMonths,effectiveMin,propertyPass,property:prop,uni,tenPercent,annualFamily,childRate:rate,annualFamilyIncome,annualAlimony,monthlyAlimony,annualEmploymentIncome2025,annualFamilyIncome2025,annualFamilyPer2025,estimatedAnnualFamilyRefund};
}
function ageSummary(){const ages=(S.childAges||[]).filter(x=>Number.isFinite(+x)&&+x>=0).map(Number);const under17=ages.filter(a=>a<17).length;const under15=ages.filter(a=>a<1.5).length;return{ages,under17,under15,hasAges:ages.length>0}}
function missingData(c){const m=[];const a=ageSummary();if(S.children>0&&!a.hasAges)m.push('Возраст каждого ребёнка — нужен для точной проверки возрастных выплат.');if(S.children>0&&a.ages.length<S.children)m.push('Указаны не все возрасты детей.');if(S.workingAdults>0&&!S.income)m.push('Не указан доход работающих членов семьи.');if(S.alimonyMode==='imputed'&&S.children>0&&!S.singleParent)m.push('Нужно подтвердить применение специального расчёта алиментов.');if(c.property.status==='unknown')m.push('Имущество пока не подтверждено: укажите объекты и проверьте исключения.');if(S.children>=2&&S.workingAdults>0&&(!S.annualEmploymentIncome2025||!S.annualFamilyIncome2025||!S.taxPaid2025))m.push('Для ежегодной семейной выплаты укажите доход семьи за 2025 год, доход заявителя с НДФЛ и фактически удержанный НДФЛ.');if(S.pregnant&&!S.pregnancyWeeks)m.push('Для выплаты беременной нужно уточнить срок беременности и постановку на учёт.');return m}
function benefitCard(id,tag,title,summary,status){return `<div class="card ${status==='ok'?'good':'warn'}"><span class="status ${status==='ok'?'ok':'need'}">${tag}</span><h3>${title}</h3><p class="muted">${summary}</p><button class="secondary" onclick="benefitDetail('${id}')">Открыть полную карточку →</button></div>`}
function programs(){let c=calc(),a=ageSummary(),m=missingData(c),cards=[];
if(S.pregnant)cards.push(benefitCard('unified-preg','Беременность','Единое пособие беременной',`Проверяем постановку на учёт до 12 недель, среднедушевой доход, доход каждого трудоспособного взрослого и имущество. Размер — 50%, 75% или 100% ПМ трудоспособного населения НСО.`,c.uni&&c.minPass?'ok':'need'));
if(a.under17>0){const st=c.uni&&c.minPass?'ok':'need';const txt=c.property.status==='unknown'?`Доходные критерии предварительно проходят/проверяются, но имущественные сведения не заполнены. Среднедушевой доход: ${money(c.per)} ₽ при пороге ${money(DB.rules.pm)} ₽.`:c.uni&&c.minPass?`Предварительно доход и имущество проходят введённые проверки: ${money(c.per)} ₽ на человека при пороге ${money(DB.rules.pm)} ₽.`:`Право пока не подтверждено: ${money(c.per)} ₽ на человека при пороге ${money(DB.rules.pm)} ₽. Проверьте конкретный критерий в полной карточке.`;cards.push(benefitCard('unified-child','0–17 лет','Единое пособие на ребёнка',txt,st));}
if(a.under15>0)cards.push(benefitCard('care','До 1,5 лет','Пособие по уходу за ребёнком',S.workingAdults>0?'Работающему получателю — 40% среднего заработка, с минимумом и максимумом 2026 года. Неработающим — отдельные категории и комплексная оценка нуждаемости.':'Неработающий родитель может иметь право при выполнении условий нуждаемости; для очников действует отдельный порядок.', 'need'));

if(S.workingAdults===0)cards.push(benefitCard('social-contract','Нет работы','Социальный контракт',`В НСО в 2026 году: ${money(DB.rules.socialContractWork)} ₽ на поиск работы и до ${money(DB.rules.socialContractBusiness)} ₽ на предпринимательскую деятельность.`, 'need'));
if(S.children>0)cards.push(benefitCard('birth','Рождение ребёнка','Единовременное пособие при рождении',`Федеральный размер с 1 февраля 2026 года — ${money(DB.rules.birth)} ₽ на каждого ребёнка. В регионах с районным коэффициентом сумма увеличивается; для НСО нужно учитывать применимый коэффициент.`, 'need'));

'social-contract':{title:'Социальный контракт',who:'Малоимущие граждане/семьи при выполнении региональных условий.',ok:false,conditions:[`Поиск работы — выплата ${money(DB.rules.socialContractWork)} ₽.`,`Предпринимательская деятельность — до ${money(DB.rules.socialContractBusiness)} ₽.`,`Для бизнеса нужен бизнес-план и прохождение предусмотренной оценки компетенций.`],calc:'Это отдельная региональная мера: право нельзя определять только по единому пособию.',why:'В профиле нет работы, поэтому меру стоит проверить отдельно; окончательное решение принимает региональный орган.',docs:['паспорт и сведения о семье','доходы и имущество','для бизнеса — бизнес-план и документы по программе'],apply:'Через органы социальной защиты/Минтруд НСО по региональному порядку.',deadline:'Зависит от направления и регионального порядка.',statement:'Прошу рассмотреть возможность заключения социального контракта по направлению, соответствующему моей жизненной ситуации.',source:'https://nszn.nso.ru/EE/News/NewsCard/670'},
'birth':{title:'Единовременное пособие при рождении ребёнка',who:'Один из родителей при рождении ребёнка; выплата не зависит от дохода семьи.',ok:S.children>0,conditions:[`В Новосибирской области в 2026 году размер с учётом районного коэффициента — ${money(DB.rules.birth)} ₽ на каждого ребёнка.`,`Если применим районный коэффициент, сумма увеличивается.`,`При рождении двух и более детей выплата производится на каждого ребёнка.`],calc:`Ориентир для Новосибирской области: ${money(DB.rules.birth)} ₽ × количество новорождённых.`,why:S.children>0?'В профиле есть дети, поэтому меру нужно проверять по факту рождения и статусу получателя.':'Нет данных о ребёнке.',docs:['сведения из ЗАГС о рождении','данные родителя','при необходимости — подтверждение проживания/родства'],apply:'Работающему родителю — без отдельного заявления, по данным ЗАГС и работодателя; если оба не работают или получатель — студент, заявление через Госуслуги, МФЦ или клиентскую службу СФР.',deadline:'Для неработающих родителей заявление подаётся в установленный срок, в том числе правило 6 месяцев со дня рождения.',statement:'Прошу назначить единовременное пособие при рождении ребёнка.',source:'https://sfr.gov.ru/grazhdanam/semyam_s_detmi/edinovremennoe_posobie_pri_rozhdenii_rebenka/'},
'sick-self':{title:'Больничный для самозанятого',who:'Самозанятый, участвующий в добровольном страховании на случай временной нетрудоспособности.',ok:false,conditions:['Нужно добровольно вступить в систему страхования.','Право возникает после 6 месяцев непрерывной уплаты взносов; страховая сумма — 35 000 или 50 000 ₽.','Сумма зависит от выбранной страховой базы и продолжительности участия.'],calc:'В текущем профиле нет подтверждения участия в добровольном страховании — поэтому право не подтверждено. Взносы: 3,84% от выбранной страховой суммы; 1 344 или 1 920 ₽ в месяц.',why:'Одного статуса самозанятого недостаточно.',docs:['сведения о статусе самозанятого','данные о добровольном страховании и уплаченных взносах','листок нетрудоспособности'],apply:'Через СФР по правилам добровольного страхования.',deadline:'Зависит от страхового случая и статуса участия.',statement:'Прошу проверить моё право на страховую выплату по временной нетрудоспособности как плательщика добровольных страховых взносов.',source:'https://sfr.gov.ru/branches/novosibirsk/news~2026/09/11/284000'}
}[id]||null;
if(!d)return `<section class="panel"><h2>Мера не найдена</h2><button class="primary" onclick="nav('programs')">← К выплатам</button></section>`;
return `<section class="panel"><button class="secondary" onclick="nav('programs')">← Все меры</button><div class="row"><h2>${d.title}</h2><span class="status ${d.ok?'ok':'need'}">${d.ok?'предварительно подходит':'нужна проверка'}</span></div><div class="card"><h3>👤 Кому положено</h3><p class="muted">${d.who}</p></div><div class="card"><h3>✅ Условия</h3>${d.conditions.map(x=>`<div class="legal">• ${x}</div>`).join('')}</div><div class="card good"><h3>🧮 Расчёт именно по вашему профилю</h3><p class="muted">${d.calc}</p></div><div class="card ${d.ok?'good':'warn'}"><h3>${d.ok?'Почему предварительно подходит':'Почему пока не подтверждено'}</h3><p class="muted">${d.why}</p></div><div class="card"><h3>📄 Что подготовить</h3>${d.docs.map((x,i)=>`<div class="legal">${i+1}. ${x}</div>`).join('')}</div><div class="card"><h3>📝 Заявление</h3><textarea class="textarea" id="benefitStatement">${d.statement}</textarea><button class="secondary" onclick="copyText('benefitStatement')">Скопировать текст</button></div><div class="card"><h3>📍 Куда подавать</h3><p class="muted">${d.apply}</p></div><div class="card"><h3>⏱ Срок / важная дата</h3><p class="muted">${d.deadline}</p><p class="small">По единому пособию СФР сообщает: после решения назначенная выплата перечисляется в течение 5 рабочих дней; при отказе уведомление с аргументированным основанием направляется через Госуслуги в течение 1 рабочего дня.</p></div><div class="card warn"><h3>❌ Если отказали</h3><p class="muted">Сохраните решение. Сначала сверяем конкретную причину отказа с условиями этой меры, затем проверяем расчётный период, доходы, алименты, имущество и межведомственные сведения. Если данные ошибочны — требуем исправления; если решение неверно — используем порядок обжалования.</p><button class="secondary" onclick="nav('refusal')">Разобрать отказ →</button></div><a class="secondary wide" href="${d.source}" target="_blank">Открыть официальный источник →</a></section>`}

function planToggle(id){S.planDone=S.planDone||{};S.planDone[id]=!S.planDone[id];save();render()}
function actions(){
 const c=calc(), items=evaluateAllPrograms(), now=new Date(), year=now.getFullYear(), month=now.getMonth()+1;
 const tasks=[];
 const add=(id,title,desc,when,go,priority='normal')=>tasks.push({id,title,desc,when,go,priority});
 const missing=missingData(c);
 if(missing.length) add('profile','1. Дозаполнить профиль','Сначала внесите только данные, которые реально влияют на расчёт: состав семьи, доходы, гражданство/проживание, имущество и подтверждённые обстоятельства.','Сегодня','profile','high');
 const uni=items.find(x=>x.id==='unified-child');
 if(uni && uni.status!=='pass') add('unified','2. Довести проверку единого пособия',uni.status==='fail'?uni.reason:'Закройте недостающие данные и повторите расчёт.','После профиля','result',uni.status==='fail'?'high':'normal');
 const annual=items.find(x=>x.id==='annual-family');
 if(annual && S.children>=2){
    const deadline=(month<=9)?'До 30 сентября '+year+' — если право подтверждается':'Следующий срок подачи уточняется по году обращения';
   add('annual','3. Проверить ежегодную семейную выплату',annual.status==='pass'?`Предварительно доступна: ${annual.amount}.`:annual.reason,deadline,'result',year===2026&&month===9?'high':'normal');
 }
 if(S.lastRefusal) add('refusal','4. Отработать сохранённый отказ','Причина отказа уже сохранена. Сначала исправьте подтверждённые ошибки/данные, затем пересчитайте все меры и только после этого решайте вопрос о повторном обращении или жалобе.','После исправления','refusal','high');
 if(c.tenPercent || S.renewal2026 || S.refusedOnlyIncome) add('tenpercent','5. Проверить специальное правило 10%','Для многодетных это отдельный механизм 2026 года, прежде всего для отказов при продлении только из-за небольшого превышения дохода.','После проверки отказа','result','high');
 const checks=items.filter(x=>x.status==='check');
 if(checks.length) add('checks','6. Закрыть жёлтые проверки',`Осталось мер со статусом «нужна проверка»: ${checks.length}. Откройте результат и пройдите по пунктам «Не хватает».`,'После основного расчёта','result','normal');
 add('submit','7. Подать заявление по официальному каналу','После проверки используйте Госуслуги, клиентскую службу СФР или МФЦ. Приложение не подменяет государственный сервис и не обещает одобрение.','После подготовки','where','normal');
 add('control','8. Контроль результата','Сохраните уведомление и срок ответа. По единому пособию СФР указывает решение в течение 10 рабочих дней после регистрации заявления и получения необходимых сведений; при необходимости срок может быть продлён по правилам услуги.','После подачи','updates','normal');
 const done=tasks.filter(t=>S.planDone[t.id]).length;
 const high=tasks.filter(t=>t.priority==='high'&&!S.planDone[t.id]);
 return `<section class="panel"><div class="row"><h2>🧭 Персональный план</h2><span class="status new">${done}/${tasks.length} выполнено</span></div>
 <div class="card good"><h3>${high.length?'Начните с этого':'План собран'}</h3><p class="muted">План строится из текущего профиля и результатов единого движка. Отметка «готово» сохраняется в браузере.</p><div class="metric"><b>${tasks.length-done}</b> незавершённых действий · <b>${checks.length}</b> мер требуют дополнительной проверки</div></div>
 ${tasks.map(t=>`<div class="legal" style="opacity:${S.planDone[t.id]?'0.62':'1'}"><div class="row"><b>${S.planDone[t.id]?'✅':'⬜'} ${t.title}</b><span class="status ${t.priority==='high'?'need':'new'}">${t.when}</span></div><p class="muted">${t.desc}</p><div class="actions"><button class="${S.planDone[t.id]?'secondary':'primary'}" onclick="planToggle('${t.id}')">${S.planDone[t.id]?'Вернуть в план':'Отметить выполненным'}</button><button class="secondary" onclick="nav('${t.go}')">Открыть →</button></div></div>`).join('')}
 <div class="card"><h3>📅 Ближайший контроль</h3><p class="muted">Для ежегодной семейной выплаты в 2026 году заявление подаётся с 1 июня до 1 октября; на практике крайняя дата — 30 сентября. Если право есть, не откладывайте проверку до последнего дня.</p><a href="https://sfr.gov.ru/grazhdanam/semyam_s_detmi/ezhegodnaya_semejnaya_vyplata" target="_blank">Официальные условия СФР →</a></div>
 <div class="card"><h3>⚖️ Важно</h3><p class="muted">«Что изменить» здесь означает только законные действия: подтвердить реальные обстоятельства, исправить ошибочные сведения в государственных реестрах, собрать документы, использовать специальное правило или подать новое заявление/жалобу. Скрывать доходы, имущество или подделывать документы нельзя.</p></div></section>`
}
function application(){let pack=submissionPack(),c=calc(),name=S.singleParent?'заявитель — единственный родитель':'заявитель';let benefit=S.children?'единого пособия в связи с рождением и воспитанием детей':'соответствующей меры социальной поддержки';let templates=[['Единое пособие','Прошу назначить единое пособие в связи с рождением и воспитанием ребёнка (детей).'],['Запрос причины отказа','Прошу предоставить мотивированное решение с указанием конкретного основания отказа, применённой нормы и порядка обжалования.'],['Исправление сведений','Прошу проверить и исправить сведения, использованные при рассмотрении моего заявления, поскольку они не соответствуют фактическим обстоятельствам.'],['Социальный контракт','Прошу рассмотреть возможность заключения социального контракта и сообщить о доступных направлениях поддержки с учётом моей ситуации.']];let children=S.children?`В составе семьи ${S.adults} взросл${S.adults===1?'ый':'ых'} и ${S.children} несовершеннолетн${S.children===1?'ий ребенок':'их детей'}. Возраст детей: ${S.childAges.length?S.childAges.join(', ')+' лет/мес.':'требует уточнения'}.`:`Состав семьи: ${S.adults} взросл${S.adults===1?'ый':'ых'}.`;let reason=S.reason&&S.reason!=='нет объективной причины'?`Объективное обстоятельство: ${S.reason}; продолжительность — ${S.objectiveMonths||0} месяцев расчётного периода.`:'';let txt=`ЗАЯВЛЕНИЕ\n\nПрошу назначить мне ${benefit} в соответствии с действующими правилами социальной поддержки.\n\nСведения о заявителе и семье:\n${children}\n${name}.\n\nДоход семьи за расчётный период: ${money(S.annualFamilyIncome)}. Среднемесячный доход семьи: ${money(S.income)}. Среднедушевой доход по предварительному расчёту: ${money(c.per)}.\n${reason}\n${S.pregnant?'Заявитель беременна.':''}\n${S.singleParent?'Отец ребёнка/детей в свидетельстве о рождении не указан — прошу учесть данный статус при проверке права.':''}\n\nПрошу проверить сведения, получаемые в порядке межведомственного взаимодействия, и сообщить о результате рассмотрения заявления. В случае отсутствия права прошу указать конкретное основание отказа и порядок его обжалования.\n\nДата: ____________    Подпись: ____________`;
return `<section class="panel"><div class="row"><h2>📝 Подготовка заявления</h2><span class="status new">Черновик</span></div><div class="card"><h3>Примеры заявлений</h3><p class="muted">Выберите цель — сервис подготовит основу текста. Это не официальная форма и не заменяет проверку реквизитов.</p><div class="cards">${templates.map((x,i)=>`<button class="secondary wide" onclick="useTemplate(${i})">${x[0]} →</button>`).join('')}</div></div><div class="notice">Это готовый черновик на основе вашего профиля. Перед отправкой проверьте персональные данные и официальную форму. Приложение не подделывает документы и не отправляет заявление за вас.</div><div class="card"><h3>Для какой меры</h3><b>${benefit}</b><p class="muted">Профиль: ${S.adults} взрослых · ${S.children} детей · доход ${money(S.income)}/мес.</p></div><textarea id="applicationText" class="textarea">${txt}</textarea><div class="actions"><button class="primary" onclick="copyText('applicationText');markCurrentApplication('Черновик')">📋 Скопировать заявление</button><button class="secondary" onclick="downloadText('applicationText','zayavlenie-mne-polozheno.txt');markCurrentApplication('Черновик')">Сохранить файл</button><button class="secondary" onclick="markCurrentApplication('Подано')">✅ Я подал заявление</button><button class="secondary" onclick="nav('where')">Куда подавать →</button></div><div class="card good"><h3>📦 Пакет подачи: ${esc(pack.title)}</h3><p class="muted">Собрал следующий набор действий автоматически по текущему профилю.</p><div class="legal"><b>Что проверить</b><br>${pack.docs.length?pack.docs.map(v=>"• "+esc(v)).join("<br>"):"• Дополнительные документы не определены."}</div><div class="legal"><b>Порядок</b><br>${pack.steps.map((v,i)=>(i+1)+". "+esc(v)).join("<br>")}</div></div><div class="legal"><b>Перед отправкой проверьте</b><p class="muted">ФИО, детей, даты рождения, доходы за расчётный период, алименты, регистрацию и имущество. Если официальная форма содержит дополнительные поля — заполните их.</p><button class="secondary" onclick="saveApplicationDraft()">💾 Сохранить как черновик</button></div></section>`}
function useTemplate(i){let t=[['Единое пособие','Прошу назначить единое пособие в связи с рождением и воспитанием ребёнка (детей).'],['Запрос причины отказа','Прошу предоставить мотивированное решение с указанием конкретного основания отказа, применённой нормы и порядка обжалования.'],['Исправление сведений','Прошу проверить и исправить сведения, использованные при рассмотрении моего заявления, поскольку они не соответствуют фактическим обстоятельствам.'],['Социальный контракт','Прошу рассмотреть возможность заключения социального контракта и сообщить о доступных направлениях поддержки с учётом моей ситуации.']][i];let el=document.getElementById('applicationText');if(el){el.value=el.value.replace(/^ЗАЯВЛЕНИЕ[\s\S]*?\n\n/,`ЗАЯВЛЕНИЕ\n\n${t[1]}\n\n`);el.scrollIntoView({behavior:'smooth',block:'center'});toast('Шаблон выбран');}}
function toast(x){let e=document.getElementById('toast');if(!e)return;e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function where(){return `<section class="panel"><div class="row"><h2>📍 Куда подавать</h2><span class="status ok">Официальные каналы</span></div><p class="muted">Для единого пособия заявление подаётся официальным способом. Сервис только готовит пользователя и документы.</p><div class="cards"><div class="card good"><h3>🟢 Госуслуги</h3><p class="muted">Основной онлайн-способ подачи заявления на единое пособие.</p><a class="secondary" href="https://www.gosuslugi.ru/" target="_blank">Открыть Госуслуги →</a></div><div class="card"><h3>🏢 МФЦ</h3><p class="muted">Можно обратиться лично в МФЦ Новосибирской области. Перед визитом уточните перечень документов и возможность подачи конкретной услуги.</p><a class="secondary" href="https://mfc-nso.ru/" target="_blank">МФЦ НСО →</a></div><div class="card"><h3>🏛️ СФР</h3><p class="muted">Можно обратиться в клиентскую службу Социального фонда России.</p><a class="secondary" href="https://sfr.gov.ru/branches/novosibirsk/" target="_blank">СФР НСО →</a></div></div><div class="legal"><b>Что выбрать?</b><p class="muted">Если хотите подать онлайн — Госуслуги. Если нужна помощь специалиста — МФЦ или клиентская служба СФР. Для региональных мер канал может отличаться — перед подачей откройте карточку конкретной меры.</p></div><div class="card warn"><h3>После отправки</h3><p class="muted">Сохраните номер заявления и решение. Если пришёл отказ — не начинайте всё заново: откройте раздел «Разобрать отказ», вставьте формулировку и проверьте период, доходы, состав семьи, алименты, имущество и основания для обжалования.</p><button class="secondary wide" onclick="nav('refusal')">❌ Разобрать отказ →</button></div><button class="primary wide" onclick="nav('documents')">📄 Проверить документы →</button></section>`}
function documents(){let c=calc(),items=['паспорт/документ, удостоверяющий личность заявителя','сведения о детях и их датах рождения','сведения о регистрации/месте жительства','сведения о доходах за расчётный период — прежде всего проверить их корректность','сведения об алиментах, если они есть или должны учитываться','сведения об объективных причинах отсутствия дохода, если они применимы','сведения об имуществе и транспорте — проверить перед подачей'];return `<section class="panel"><div class="row"><h2>📄 Документы и данные</h2><span class="status new">Чек-лист</span></div><p class="muted">Для многих федеральных выплат часть сведений СФР получает межведомственно. Поэтому здесь не обещаем, что каждый пункт нужно нести лично: это список того, что стоит проверить.</p>${items.map((x,i)=>`<div class="legal"><b>${i+1}. ${x}</b></div>`).join('')}<div class="card good"><h3>Перед подачей</h3><p class="muted">Проверьте, что расчётный период установлен верно: ${periodLabel()}. Ваш предварительный среднедушевой доход — ${money(c.per)}.</p></div><button class="primary wide" onclick="nav('application')">📝 Перейти к заявлению →</button></section>`}
function copyText(id){let x=document.getElementById(id);navigator.clipboard?.writeText(x.value).then(()=>alert('Заявление скопировано')).catch(()=>{x.select();document.execCommand('copy');alert('Заявление скопировано')})}
function downloadText(id,name){let x=document.getElementById(id).value;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

function simulatePatch(patch){const keys=Object.keys(patch),old={};keys.forEach(k=>old[k]=S[k]);Object.assign(S,patch);syncDerived();const c=calc(),items=evaluateAllPrograms();keys.forEach(k=>S[k]=old[k]);syncDerived();return {c,items};}
function simulationSuggestions(){
 const base=calc(), items=evaluateAllPrograms(), out=[];
 const uni=items.find(x=>x.id==='unified-child');
 if(uni&&uni.status!=='pass'&&S.children>0){
   if(base.per>DB.rules.pm){const target=Math.max(0,DB.rules.pm*(S.members||1)*12-(base.annualAlimony||0));out.push({title:'Если фактический доход семьи ниже порога',patch:{annualFamilyIncome:target},note:`При фактическом доходе семьи около ${money(target)} ₽ за расчётный период среднедушевой доход окажется около ПМ. Это только сценарий — указывать можно исключительно реальные сведения.`});}
   if(!base.minPass){const adults=Math.max(1,S.adults||1), patch={adultAnnualIncomes:(S.adultAnnualIncomes||[]).slice()};while(patch.adultAnnualIncomes.length<adults)patch.adultAnnualIncomes.push(S.annualAdultIncome||0);base.adultMin.forEach((a,i)=>{if(!a.passes)patch.adultAnnualIncomes[i]=a.required;});out.push({title:'Если фактический доход взрослых достигнет требуемого уровня',patch,note:'Сценарий показывает минимальный уровень, который движок использует для проверки правила 8 МРОТ. Не означает, что доход можно искусственно создавать или скрывать.'});}
   if(base.property.status!=='pass'){out.push({title:'Если имущественные сведения будут исправлены/подтверждены',patch:{propertySupport:false,propertyArrested:false,propertyBad:false,propertySharedThird:false},note:'Сценарий полезен, если в отказе указано имущество ошибочно или применимо подтверждённое исключение. Реестр и документы должны отражать фактическое положение.'});}
   if(S.children>=3&&S.renewal2026&&S.refusedOnlyIncome&&base.per>DB.rules.pm&&base.per<=DB.rules.pm*1.10){out.push({title:'Если отказ относится к специальному правилу 10%',patch:{},note:'Здесь изменение профиля не требуется: нужно проверить, что это именно продление в 2026 году и отказ только из-за превышения дохода. Для подходящих случаев СФР проводит пересмотр.'});}
 }
 return out.slice(0,4).map(x=>({...x,...simulatePatch(x.patch)}));
}
function simulator(){const base=calc(),items=evaluateAllPrograms(),sugs=simulationSuggestions();return `<section class="panel"><div class="row"><h2>🧪 Симулятор выхода из отказа</h2><span class="status new">Было → станет</span></div><p class="muted">Здесь можно увидеть, как изменится результат при изменении одного условия. Это моделирование, а не совет и не инструкция менять реальные сведения. При подаче заявления указываются только фактические данные.</p><div class="card"><h3>Сейчас</h3><div class="grid"><div class="metric">Среднедушевой доход<br><b>${money(base.per)}</b></div><div class="metric">8 МРОТ<br><b>${base.minPass?'проходит':'не проходит'}</b></div><div class="metric">Имущество<br><b>${base.property.title}</b></div><div class="metric">Меры<br><b>${items.filter(x=>x.status==='pass').length} / ${items.length}</b></div></div></div>${sugs.length?`<div class="cards">${sugs.map((x,i)=>{const before=x.items.map(v=>v.status).join('|'),after=x.items.map(v=>v.status).join('|');const afterPass=x.items.filter(v=>v.status==='pass').length;return `<div class="card ${afterPass>items.filter(v=>v.status==='pass').length?'good':'warn'}"><h3>${i+1}. ${x.title}</h3><p class="muted">${x.note}</p><div class="legal"><b>После сценария</b><br>🟢 ${afterPass} положено · 🟡 ${x.items.filter(v=>v.status==='check').length} проверить · 🔴 ${x.items.filter(v=>v.status==='fail').length} не положено</div><div class="legal"><b>Что изменилось</b><br>${x.items.map(v=>{const old=items.find(o=>o.id===v.id);return old&&old.status!==v.status?`${v.title}: ${old.status==='fail'?'🔴':old.status==='check'?'🟡':'🟢'} → ${v.status==='fail'?'🔴':v.status==='check'?'🟡':'🟢'}`:''}).filter(Boolean).join('<br>')||'Статус мер не изменился — нужно другое условие.'}</div></div>`}).join('')}</div>`:`<div class="notice">Для текущего профиля автоматических сценариев изменения результата пока нет. Уточните данные профиля или разберите текст отказа.</div>`}<div class="card good"><h3>⚖️ Законный принцип</h3><p class="muted">Симулятор не ищет способы обойти требования. Он показывает только последствия изменения реальных обстоятельств или исправления ошибочных межведомственных сведений.</p></div><div class="actions"><button class="primary" onclick="nav('result')">← Вернуться к результату</button><button class="secondary" onclick="nav('profile')">Уточнить профиль</button><button class="secondary" onclick="nav('refusal')">Разобрать отказ</button></div></section>`}

function scenario(){let c=calc();return `<section class="panel"><h2>🧪 Сценарий «А что если?»</h2><p class="muted">Меняйте доход — сервис сразу пересчитывает ориентир. Это не совет скрывать доход: реальные сведения должны быть указаны при обращении.</p>${field('Новый доход семьи в месяц, ₽',`<input type="number" value="${S.income}" oninput="S.income=+this.value||0;S.annualFamilyIncome=S.income*12;render()">`)}${field('Количество взрослых',`<input type="number" value="${S.adults}" oninput="S.adults=Math.max(1,+this.value||1);S.members=S.adults+S.children;render()">`)}${field('Количество детей',`<input type="number" value="${S.children}" oninput="S.children=+this.value||0;S.members=S.adults+S.children;render()">`)}<div class="metric"><span class="muted">Среднедушевой доход</span><br><b>${money(c.per)}</b><br><span class="status ${c.uni?'ok':'need'}">${c.uni?'Ниже ПМ':'Выше ПМ'}</span></div><div class="actions"><button class="primary" onclick="nav('result')">Применить сценарий</button></div></section>`}
function refusal(){let hist=S.refusalHistory||[];return `<section class="panel"><div class="row"><h2>❌ Разбор отказа</h2><span class="status new">Пошагово</span></div><p class="muted">Вставьте полный текст решения из Госуслуг/СФР. После разбора причина сохраняется в профиле, чтобы следующий расчёт учитывал уже разобранный отказ.</p><textarea class="textarea" id="reftext" placeholder="Например: отказано в назначении единого пособия в связи с превышением среднедушевого дохода семьи над величиной прожиточного минимума…">${S.lastRefusal?.text?esc(S.lastRefusal.text):''}</textarea><button class="primary wide" onclick="analyzeRefusal()">Разобрать отказ →</button><div class="notice">Если причина отказа вам неизвестна, вставьте решение целиком — не пересказывайте его своими словами.</div>${S.lastRefusal?`<div class="card good"><h3>🧠 Последний разобранный отказ</h3><p class="muted">${esc(S.lastRefusal.summary||'Причина сохранена')}</p><div class="actions"><button class="primary" onclick="nav('result')">🔄 Пересчитать всё →</button><button class="secondary" onclick="nav('programs')">🎯 Посмотреть альтернативы</button></div></div>`:''}${hist.length?`<div class="card"><h3>История разборов</h3>${hist.slice(-5).reverse().map((x,i)=>`<div class="legal"><b>${esc(x.date||'')} · ${esc((x.causes||[]).join(', ')||'Причина не определена')}</b><p class="muted">${esc(x.text||'').slice(0,240)}${(x.text||'').length>240?'…':''}</p></div>`).join('')}</div>`:''}</section>`}
function analyzeRefusal(){let raw=document.getElementById('reftext').value.trim(),t=raw.toLowerCase().replace(/ё/g,' ');if(!raw){alert('Вставьте текст решения об отказе.');return}let c=calc(),cases=[];
if(/среднедуш|прожиточн|доход.*превыш|превыш.*доход/.test(t))cases.push({title:'Превышение дохода',why:'Среднедушевой доход семьи выше установленного порога либо в решении указан такой расчёт.',check:[`Ваш предварительный среднедушевой доход: ${money(c.per)} ₽`,`Порог НСО 2026: ${money(DB.rules.pm)} ₽`,`Разница: ${money(Math.max(0,c.per-DB.rules.pm))} ₽ на человека`],action:'Перепроверьте расчётный период, все доходы и алименты. Если отказ был именно при продлении единого пособия в 2026 году и превышение не больше 10%, проверьте специальный механизм для многодетных семей.',go:'programs'});
if(/8\s*мрот|минимальн.*доход|нулев|отсутств.*доход|доход.*менее/.test(t))cases.push({title:'Недостаточный доход / правило 8 МРОТ',why:'С 2026 года для трудоспособного члена семьи базовый минимум — 8 МРОТ за расчётный период. При объективных причинах он уменьшается пропорционально, а при 10+ месяцах причина может полностью снять требование.',check:[`Базовый минимум: ${money(DB.rules.minAnnual)} за 12 месяцев`,`Указанная объективная причина: ${S.reason}`,`Месяцев причины: ${S.objectiveMonths||0}`,`Расчётный минимум по профилю: ${money(c.effectiveMin)}`],action:'Проверить по каждому трудоспособному взрослому период работы, официальную безработицу, беременность, уход и другие подтверждённые объективные причины. Если причина подтверждается документами, исправить сведения/предоставить подтверждение и затем повторно обратиться или обжаловать отказ.',go:'profile'});
if(/имуще|транспорт|автомоб|квартир|жиль|земел|гараж|мотоцикл|судн/.test(t)){let p=S.apartments>1&&S.apartmentArea/S.members>24?`Квартиры: ${S.apartmentArea} м² / ${S.members} = ${(S.apartmentArea/S.members).toFixed(1)} м² на человека — выше 24 м².`:'Проверьте квартиры и их площадь по сведениям Росреестра.';let h=S.houses>1&&S.houseArea/S.members>40?`Дома: ${S.houseArea} м² / ${S.members} = ${(S.houseArea/S.members).toFixed(1)} м² на человека — выше 40 м².`:'Проверьте дома и их площадь по сведениям Росреестра.';cases.push({title:'Имущественный критерий',why:'СФР учитывает недвижимость, транспорт и другие объекты по установленным правилам и получает значительную часть сведений межведомственно.',check:[p,h,`Автомобилей в профиле: ${S.cars||0}; мотоциклов: ${S.motos||0}; гаражей/машино-мест: ${S.garages||0}; земли: ${S.landHa||0} га.`,`Исключения: ${S.propertySupport||S.propertyArrested||S.propertyBad||S.propertySharedThird?'указаны — требуется подтверждение':'не указаны'}`],action:'Сверить конкретный объект из решения с реестровыми данными. Если объекта фактически нет или сведения ошибочны, исправить сведения в соответствующем государственном органе и после исправления подать новое заявление. Если объект есть, проверить применимость исключения и порядок обжалования.',go:'profile'});}
if(/алим/.test(t))cases.push({title:'Алименты',why:'С 1 марта 2026 года при отсутствии судебного решения/приказа алименты могут вменяться исходя из среднемесячной номинальной зарплаты региона.',check:[`Режим алиментов в профиле: ${S.alimonyMode}`,`Предварительно учтено: ${money(c.monthlyAlimony)} в месяц`,`Для НСО СФР указывает доли 1/4, 1/3 или 1/2 в зависимости от числа детей`],action:'Сверить, был ли суд/судебный приказ, сколько фактически получено и что указано в заявлении. Для единственного родителя с прочерком в графе «отец» вменение алиментов на этого ребёнка не применяется.',go:'profile'});
if(/многодет|10\s*%|десяти|процент/.test(t))cases.push({title:'Специальное правило для многодетных в 2026 году',why:'Для некоторых отказов при продлении единого пособия действует специальный механизм, если доход превышал ПМ не более чем на 10%.',check:[`Детей в профиле: ${S.children}`,`ПМ НСО: ${money(DB.rules.pm)}`,`10% порог: ${money(DB.rules.pm*1.10)}`,`Ваш предварительный доход: ${money(c.per)}`],action:'Проверить, что речь именно о продлении единого пособия в 2026 году и отказе исключительно из-за превышения дохода. Для подходящих случаев СФР НСО указывал на беззаявительный пересмотр.',go:'programs'});
if(/документ|сведен|не подтверж|мест[оа].*прожив|регистрац/.test(t))cases.push({title:'Сведения / документы / проживание',why:'Отказ может быть связан не с правом как таковым, а с тем, что государственные сведения не совпали или не подтвердились.',check:['Проверить ФИО, даты рождения детей, регистрацию/место пребывания','Сверить сведения о доходах, браке, детях и алиментах','Проверить, не запрашивал ли СФР подтверждающий документ'],action:'Исправить неверные сведения или представить запрошенное подтверждение. После устранения причины новое заявление можно подать заново.',go:'documents'});
if(!cases.length)cases.push({title:'Причина не распознана',why:'Формулировка решения недостаточно конкретна для автоматического определения основания.',check:['Откройте полный текст решения','Найдите раздел с конкретным основанием отказа и нормой/условием','Сверьте расчётный период и исходные сведения'],action:'Не подавайте новое заявление вслепую. Сначала определите конкретную причину отказа; затем исправьте причину либо используйте предусмотренный порядок обжалования.',go:'application'});
let causes=cases.map(x=>x.title);S.lastRefusal={text:raw,date:new Date().toLocaleDateString('ru-RU'),causes,summary:causes.join(' · ')};S.refusalHistory=[...(S.refusalHistory||[]),S.lastRefusal].slice(-10);saveRefusalToHistory();if(causes.some(x=>x.includes('Специальное правило')))S.renewal2026=true;if(causes.some(x=>x.includes('Имущественный')))S.property='не подтверждено — есть отказ по имуществу';save();
let html=`<section class="panel"><div class="row"><h2>🔎 Разбор отказа</h2><span class="status need">${cases.length} проверки</span></div><div class="card warn"><h3>Что написано в решении</h3><p class="muted">${esc(raw)}</p></div>`;
for(let x of cases){html+=`<div class="card"><h3>⚠️ ${esc(x.title)}</h3><p class="muted"><b>Что проверить:</b> ${esc(x.why)}</p>${x.check.map((q,i)=>`<div class="legal"><b>${i+1}.</b> ${esc(q)}</div>`).join('')}<div class="legal"><b>Следующий законный шаг</b><p class="muted">${esc(x.action)}</p></div><button class="secondary" onclick="nav('${x.go}')">Перейти →</button></div>`}
let titles=causes.join('; ');let appeal='ЖАЛОБА НА РЕШЕНИЕ ОБ ОТКАЗЕ\n\nПрошу пересмотреть решение об отказе в назначении меры социальной поддержки.\n\nВыявленные при предварительном разборе основания: '+titles+'.\n\nПрошу проверить корректность сведений, использованных при принятии решения, расчётный период, состав семьи, доходы, алименты, сведения об имуществе и иные обстоятельства, имеющие значение для назначения выплаты. Прошу предоставить мотивированный ответ с указанием конкретных фактов и применённой нормы.\n\nЕсли в межведомственных сведениях имеются ошибки, прошу учесть исправленные сведения и повторно рассмотреть вопрос о назначении выплаты.\n\nДата: ____________    ФИО: ____________________    Подпись: ____________';let safeAppeal=esc(appeal);html+=`<div class="card good"><h3>📝 Готовый черновик жалобы</h3><p class="muted">Черновик не является юридическим заключением: перед отправкой проверьте факты, даты и конкретную услугу.</p><textarea class="textarea" id="appealText" style="min-height:240px">${safeAppeal}</textarea><div class="actions"><button class="primary" onclick="copyAppeal()">📋 Скопировать жалобу</button><button class="secondary" onclick="nav('application')">📝 Другие шаблоны</button></div></div><div class="card"><h3>🔄 Профиль обновлён</h3><p class="muted">Причина отказа сохранена. Теперь единый движок может пересчитать профиль и показать альтернативные меры без повторного ввода ситуации.</p><div class="actions"><button class="primary" onclick="nav('result')">🔄 Пересчитать все меры</button><button class="secondary" onclick="nav('programs')">🎯 Альтернативные меры</button></div></div><div class="legal"><b>⚖️ Законные возможности</b><p class="muted">Если решение СФР нарушает порядок или основано на неверных сведениях, предусмотрено досудебное обжалование. Сервис не предлагает скрывать доходы, имущество, фиктивно менять обстоятельства или подделывать документы.</p><a href="https://sfr.gov.ru/about/smev/dosudeb/" target="_blank">Официальный порядок досудебного обжалования СФР →</a></div></section>`;document.getElementById('app').innerHTML=html}
function copyAppeal(){let el=document.getElementById('appealText');if(!el)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el.value).then(()=>toast('Жалоба скопирована')).catch(()=>{el.select();document.execCommand('copy');toast('Жалоба скопирована')})}else{el.select();document.execCommand('copy');toast('Жалоба скопирована')}}
function updates(){return `<section class="panel"><div class="row"><h2>🔄 Контроль изменений</h2><span class="status ok">База ${DB.checked} · ${DB.version}</span></div><div class="card good"><h3>🟢 Последняя проверка официальных источников</h3><p class="muted">В базу уже внесены свежие публикации СФР по Новосибирской области. Ниже — изменения, которые могут быть полезны пользователю прямо сейчас.</p></div>${(DB.changes||[]).map(x=>`<div class="legal"><b>${x.date} · ${x.title}</b><p class="muted">${x.note||''}</p><a href="${x.source}" target="_blank">Официальный источник →</a></div>`).join('')}<div class="card"><h3>🆕 Самозанятые: больничный</h3><p class="muted">Если самозанятый вступил в программу добровольного страхования в 2026 году и платит взносы не менее 6 месяцев подряд, он может получить больничные. Страховая сумма по программе — 35 000 или 50 000 ₽ за полный месяц нетрудоспособности.</p><a class="secondary" href="https://sfr.gov.ru/branches/novosibirsk/news/~2026/09/11/284651" target="_blank">Проверить условия в СФР →</a></div><div class="card"><h3>🆕 Маткапитал</h3><p class="muted">СФР по НСО сообщает, что основная часть решений по заявлениям о распоряжении маткапиталом сейчас принимается примерно за 4 рабочих дня.</p><a class="secondary" href="https://sfr.gov.ru/branches/novosibirsk/news/~2026/09/08/284545" target="_blank">Официальное сообщение →</a></div><div class="card"><h3>⚙️ Автомониторинг</h3><p class="muted">В этой версии добавлен готовый GitHub Actions-мониторинг: он периодически проверяет официальные страницы, сравнивает их содержимое и формирует отчёт при изменении. Юридические правила не меняются автоматически без проверки.</p><div class="metric"><b>Режим: контроль → отчёт → проверка → публикация</b></div></div><div class="card"><h3>Официальные источники</h3>${DB.sources.map(s=>`<div class="legal"><b>${s.name}</b><br><a href="${s.url}" target="_blank">Открыть источник →</a></div>`).join('')}</div></section>`}
function settings(){return `<section class="panel"><div class="row"><h2>🗄️ Управление базой</h2><span class="status new">Локальная база</span></div><p class="muted">Это рабочий механизм обновления правил без переписывания приложения. Можно импортировать новый JSON-файл базы, проверить версию и сохранить её на устройстве.</p><div class="card"><h3>Текущая версия</h3><div class="amount">${DB.version}</div><p class="muted">Последняя проверка: ${DB.checked}<br><span class="small">Средняя зарплата НСО для расчёта алиментов: ${money(DB.rules.avgSalary2025)}</span></p></div><div class="actions"><button class="primary" onclick="document.getElementById('dbfile').click()">Импортировать базу JSON</button><button class="secondary" onclick="exportDB()">Экспортировать текущую базу</button><button class="secondary" onclick="resetDB()">Сбросить базу</button></div><input id="dbfile" type="file" accept="application/json,.json" class="hidden" onchange="importDB(this.files[0])"><div class="notice">В боевой версии этот же формат подключается к серверному хранилищу. Приложение не считает локальные данные официальным решением государства.</div></section>`}
function exportDB(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mne-polozheno-db.json';a.click();URL.revokeObjectURL(a.href)}
function importDB(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.rules||!x.version||!x.checked)throw Error('bad');localStorage.setItem('mne_db_override',JSON.stringify(x));location.reload()}catch(e){alert('Не удалось импортировать базу. Нужны поля version, checked и rules.')}};r.readAsText(file)}
function resetDB(){localStorage.removeItem('mne_db_override');location.reload()}
function render(){document.getElementById('nav').innerHTML=navHtml();let x=S.screen==='home'?home():S.screen==='navigator'?navigatorView():S.screen==='cabinet'?cabinet():S.screen==='chat'?chat():S.screen==='profile'?profile():S.screen==='audit'?audit():S.screen==='result'?result():S.screen==='plan'?actionPlanView():S.screen==='programs'?programs():S.screen==='benefit'?benefitDetailView():S.screen==='actions'?actions():S.screen==='application'?application():S.screen==='where'?where():S.screen==='documents'?documents():S.screen==='scenario'?scenario():S.screen==='simulator'?simulator():S.screen==='history'?historyView():S.screen==='updates'?updates():S.screen==='settings'?settings():home();document.getElementById('app').innerHTML=x}
render();
</script><div id="toast" class="toast"></div></body></html>
